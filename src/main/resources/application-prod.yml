server:
  port: 8080
  address: 127.0.0.1  # 只监听本地，通过Nginx代理

spring:
  datasource:
    # 阿里云 RDS：设置环境变量 DB_URL、DB_USERNAME、DB_PASSWORD
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reportweb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false  # 生产环境关闭SQL日志
    hibernate:
      ddl-auto: none

# JWT配置（使用环境变量）
jwt:
  secret: ${JWT_SECRET}  # 使用环境变量，务必修改！
  expiration: 604800000  # 7天（毫秒）；原 86400000 为 24 小时

# 文件上传目录
file:
  upload-dir: /opt/reportweb/uploads

# 签名目录
signatures:
  dir: /opt/reportweb/signatures

# 日志配置
logging:
  level:
    com.reportweb: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /opt/reportweb/logs/application.log
    max-size: 10MB
    max-history: 30

# 应用初始化（生产环境关闭）
app:
  init:
    power-plants: false
    instruments: false
  word-export-job:
    retention-days: 7
    cleanup-cron: "0 30 3 * * *"
