# Nginx 配置：检测报告 Web 系统（阿里云 ECS 部署）
# 用法：复制到 /etc/nginx/conf.d/reportweb.conf，修改 server_name 和 root 路径后执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    # 有域名时填写，例如 report.yourcompany.com；无域名可改为 _ 或留空
    server_name _;
    # 前端构建产物目录（部署时把 frontend/dist 内容放到此目录）
    root /opt/reportweb/www;
    index index.html;

    # 前端 SPA：除 /api 和静态资源外都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理到 Spring Boot
    # 与业务附件上限约 50MB 对齐（默认 1m 会导致大文件上传连接被重置）
    location /api/ {
        client_max_body_size 55m;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 上传文件目录（由后端或 Nginx 直接提供，按需二选一）
    # 若后端提供 /api/images/xxx，可删除此 location；若希望 Nginx 直接提供静态文件，保留并确保路径存在
    location /uploads/ {
        alias /opt/reportweb/uploads/;
    }
}
